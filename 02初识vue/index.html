<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始vue</title>
    <script src="https://unpkg.com/vue@3.5.42/dist/vue.global.js"></script>
</head>
<body>
    <div id="demo">
        <h2>欢迎来到【{{name}}】！地址是【{{address}}】。 </h2>
    </div>
</body>


<script>
    const {createApp} = Vue
    const app = createApp({
        setup(){
            let name = "英雄联萌"
            let address = "召唤师大厦"
            return {name,address} 
        }
    })
    app.mount("#demo")
</script>
</html>
