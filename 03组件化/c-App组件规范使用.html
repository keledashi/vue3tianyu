<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App组件规范使用</title>
    <script src="https://unpkg.com/vue@3.5.42/dist/vue.global.js"></script>
    <style>
        .school{
            background-color: gold;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 5px black;
        }
        .ren{
            background-color:red;
            color:white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 5px black;
        }
    </style>
</head>
<body>
    <div id="demo">

    </div>
    <script>
        const Tang = {
            template:`
                <div class="school">
                    <h2>欢迎来到 [{{name}}] ! 地址是:[{{address}}]</h2>
                </div>
            `,
            setup(){
                let name = "糖巢"
                let address = "交通路"
                return {name,address}
            }
        }

        const Zhao = {
            template:`
                <div class="ren">
                    <h2>我叫 [{{name}}] , 来自:[{{address}}] </h2>
                </div>
            `,
            setup(){
                let name = "赵一鸣"
                let address = "中亭街"
                return {name,address}
            }

        }
        const App = {
            components:{Tang,Zhao},
            template:`
                <Tang/>
                <hr>
                <Zhao/>
            `
        }
        Vue.createApp(App).mount("#demo")

    </script>
</body>
</html>
