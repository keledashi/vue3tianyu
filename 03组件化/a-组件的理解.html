<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件的理解</title>
    <script src="https://unpkg.com/vue@3.5.42/dist/vue.global.js"></script>
    <style>
        .school{
            background-color: aquamarine;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 5px;
        }
        .ren{
            background-color:gold;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 5px;
        }
    </style>
</head>
<body>
    <div id="demo">
        <div class="school">
            <h2>欢迎来到 {{school.name}} ! 地址是:{{school.address}}</h2>
        </div>
        <hr>
        <div class="ren">
            <h2>我叫 {{ren.name}} , 来自:{{ren.address}} </h2>
        </div>
    </div>
    <hr>
    <div>
        <h2>对组件化的理解</h2>
        <p>
            直接在html中使用vue的弊端：不同的功能呢（结构、样式、逻辑）混在一起，<br>
            随着功能的增多，代码变得混乱且难以维护。
        </p>
        <h2>如何解决上述问题</h2>
        <p>
            将页面中某一部分结构、样式、逻辑封装起来，形成一个独立的、可复用的单元。
        </p>
        <h2>两个重要概念</h2>
        <p>
            1.组件：应用中局部功能代码的集合，它是独立的、可复用的单元。<br>
            2.组件化：将页面拆分成多个组件，并通过这些组件的组合来构建完整的页面。
        </p>
    </div>


    <script>
        // 1.解构vue对象获取createApp函数
        const {createApp} = Vue

        // 2.使用createApp函数传入数据
        const app = createApp({
            setup(){
                let school = {
                    name:"闽江学院附中",
                    address:"王庄大树兜"
                }
                let ren = {
                    name:"赵一鸣",
                    address:"福州"
                }
                return {school,ren}
            }
        })

        // 3.挂载页面容器
        app.mount("#demo")
    </script>
</body>
</html>
